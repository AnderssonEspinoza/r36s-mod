name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python integration and safety tests
        run: python3 -m unittest discover -s tests -v
      - name: POSIX shell syntax
        run: |
          sh -n install.sh
          sh -n payload/r36s-game-performance
          sh -n payload/S56r36s-saveguard
      - name: Public repository content
        run: python3 scripts/check-publication.py
